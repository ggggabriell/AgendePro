compose-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
### Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinBOM" }
koin-android-workmanager = { module = "io.insert-koin:koin-androidx-workmanager" }
